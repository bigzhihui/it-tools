name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac # v4
      - run: corepack enable
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run linters
        run: pnpm lint

      - name: Run unit test
        run: pnpm exec vitest run --environment jsdom

      - name: Type check
        run: pnpm typecheck

      - name: Build the app
        run: pnpm build

      - name: Validate generated HTML and local links
        env:
          QUALITY_SCRIPT_SHA256: 5becf9c6ed5dd4b337082f8d844aafcb35ac467baa23035052163d66db98e71e
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 'https://raw.githubusercontent.com/bigzhihui/afeiii-portal/a86bb6a690add16309c6b7db826b0d5a400dee4f/scripts/check_generated_quality.py' --output "${RUNNER_TEMP}/check_generated_quality.py"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"check_generated_quality.py"; assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ["QUALITY_SCRIPT_SHA256"], "Quality checker integrity mismatch"'
          python3 "${RUNNER_TEMP}/check_generated_quality.py" --bootstrap --root dist --tools "${RUNNER_TEMP}/afeiii-quality-tools" --baseline scripts/quality-baseline.json --output "${RUNNER_TEMP}/tools-quality.json"

      - name: Install Chromium for public UI checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Check public UI accessibility and core interactions
        run: node scripts/check-public-ui.mjs
