    title: Text diff
    description: Compare two texts and see the differences between them.
    originalTextPlaceholder: original text
    modifiedTextPlaceholder: modified text
    guide:
      intro: "Compares two pieces of text and highlights additions, deletions and changes in different colours. It is well suited to reviewing code changes, config edits or two versions of a document."
      usage: "Paste the original text on the left and the modified text on the right, and the differences are highlighted line by line. Both sides are editable and the result updates live."
      q1: "Is my text uploaded?"
      a1: "No. The comparison runs entirely in your browser, which makes it safe for code or config containing sensitive information."
      q2: "How large can the texts be?"
      a2: "Typical source files and documents compare smoothly. At tens of thousands of lines rendering slows down noticeably, so compare in sections."
      q3: "Is the comparison by line or by character?"
      a3: "It first finds the lines that changed, then marks the exact characters that differ within those lines, making small edits easy to spot."
