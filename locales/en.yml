    stringToDecodePlaceholder: The string to decode
    stringDecoded: "Your string decoded :"
    stringDecodedPlaceholder: Your string decoded
    copiedDecoded: Decoded string copied to the clipboard
    parseError: Impossible to parse this string
    guide:
      intro: "Only some characters can appear in a URL as is. Non-ASCII text, spaces and many symbols must be percent-encoded to travel safely. This tool converts between plain strings and URL encoding in both directions."
      usage: "Type a plain string in the encode panel to get its percent-encoded form. Paste an encoded string such as %E4%BD%A0 in the decode panel to turn it back into readable text."
      q1: "Why is a space encoded as %20 rather than a plus sign?"
      a1: "The tool follows encodeURIComponent, which always encodes a space as %20. Using a plus sign for a space comes from HTML form submissions, and most servers understand both."
      q2: "Which characters are left unencoded?"
      a2: "Letters, digits and the symbols - _ . ! ~ * ' ( ) stay as they are. Everything else is encoded, including slash, question mark and equals sign, which makes it the right choice for a single query parameter value."
      q3: "Why does decoding fail?"
      a3: "Usually a percent sign is followed by something that is not valid hexadecimal, or a multi-byte character was cut off part way. Check that the encoded string is complete."
