      sub: Subject
      aud: Audience
      exp: Expiration Time
      nbf: Not Before
      iat: Issued At
      jti: JWT ID
      name: Full name
      email: Email
    guide:
      intro: "A JWT is a common credential format made of a header, a payload and a signature. This tool decodes a JWT into readable content and explains standard fields such as the issuer and expiry. Decoding happens locally and the token is never uploaded."
      usage: "Paste a complete JWT and the header and payload are shown as separate tables, with the expiry, not-before and issued-at times converted to readable dates."
      q1: "Does this tool verify the signature?"
      a1: "No. It only decodes and does not check the signature, so it cannot tell whether a token has been tampered with. A server must verify the signature with its key before trusting a JWT."
      q2: "Is the JWT payload encrypted?"
      a2: "No. The payload is only Base64URL encoded, so anyone holding the token can read it. Never put passwords or other secrets in a JWT."
      q3: "Is it safe to paste a production token here?"
      a3: "Decoding happens entirely in your browser and the token is not sent anywhere. A valid token is still a login credential, though, so avoid pasting or sharing it in places you do not trust."
