    guide:
      intro: "Seeing matches while you write a regular expression cuts trial and error dramatically. This tool shows match positions, capture groups and named groups live, and can draw a syntax diagram and generate random matching samples."
      usage: "Enter a regular expression and the text to test, and the matches are listed as you type. Toggles enable global, case-insensitive, multiline, dotall and Unicode modes."
      q1: "Which regex flavour is tested here?"
      a1: "The JavaScript regex engine, behaving exactly as in browsers and Node.js. Other languages are broadly similar but can differ in details such as named group syntax and lookbehind support."
      q2: "Why is only the first match found?"
      a2: "Enable the global flag, g. Without it, a regular expression returns only the first match."
      q3: "What is the difference between multiline and dotall mode?"
      a3: "Multiline makes the start and end anchors match at every line break, while dotall lets the dot match newline characters too. They do different things and can be enabled together."
