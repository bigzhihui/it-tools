    guide:
      intro: "Turns pages that face the wrong way, such as a contract scanned upside down or a landscape table page. You can rotate every page or only the pages you choose. Everything happens in your browser, so the file is never uploaded to a server."
      usage: "Choose a PDF file, pick a direction, choose all pages or selected pages, then click rotate and download. Selected pages use the same notation as a print dialog, for example 1-3, 5."
      q1: "Does rotating reduce quality?"
      a1: "No. Rotating only changes the direction a page is displayed in. Text and images on the page are not re-compressed."
      q2: "Are bookmarks, links and forms kept?"
      a2: "Yes. The direction of the pages is changed in the original file, and bookmarks, links, forms and everything else stay as they were."
      q3: "What if a page is already rotated?"
      a3: "It turns further from its current direction. A page already turned 90° clockwise ends up upside down after another 90° clockwise turn."
      q4: "Do digital signatures stay valid?"
      a4: "No. Rotating changes the file, so any existing digital signature becomes invalid. Sign the file again if needed."
      q5: "Can encrypted PDFs be rotated?"
      a5: "No. Pages of a password-protected file cannot be read. Remove the protection with other software first."
