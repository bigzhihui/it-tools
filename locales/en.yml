    yourStringUnescaped: "Your string unescaped :"
    stringUnescapedPlaceholder: Your string unescaped
    copied: Copied to clipboard!
    guide:
      intro: "To show less-than, greater-than, ampersand or quote characters on a web page, they must first be escaped as HTML entities, otherwise the browser may treat them as markup and open the door to cross-site scripting. This tool escapes and unescapes in both directions."
      usage: "Type plain text in the escape panel to get the entity-encoded result. Paste text containing entities such as &lt; in the unescape panel to get the original characters back."
      q1: "Which characters are escaped?"
      a1: "Five characters with special meaning in HTML: less-than, greater-than, ampersand, double quote and single quote."
      q2: "Does escaping prevent XSS?"
      a2: "Escaping these five characters is the basic defence when inserting user input into HTML body content. Inside JavaScript code, URLs or styles, you need the escaping rules for that context, and HTML escaping alone is not enough."
      q3: "Does non-English text need escaping?"
      a3: "No. As long as the page declares UTF-8, such text displays directly. Escaping only applies to characters with special meaning."
