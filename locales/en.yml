  base-converter:
    title: Integer base converter
    description: Convert a number between different bases (decimal, hexadecimal, binary, octal, base64, ...)
    guide:
      intro: "Converts integers between binary, octal, decimal and hexadecimal, and supports any base from 2 to 64. It is handy for checking bitwise results, permission codes or colour values."
      usage: "Enter a number and its current base, and the value in every base appears together. For another base, set the target in the custom field. Integers of any size are supported."
      q1: "Why is uppercase hexadecimal rejected?"
      a1: "Digits are case-sensitive here. For bases up to 36, use lowercase letters, so enter ff rather than FF. Uppercase letters are only used by higher bases."
      q2: "Are negative numbers and decimals supported?"
      a2: "No. Only non-negative integers are handled, and a minus sign or decimal point is reported as an invalid character."
      q3: "Is base 64 the same as Base64 encoding?"
      a3: "No. Base 64 here is a positional conversion of an integer, while Base64 encoding turns arbitrary bytes into text. They use a different character order and serve different purposes."
  yaml-to-json-converter:
    title: YAML to JSON converter
    description: Simply convert YAML to JSON with this online live converter.
    inputLabel: Your YAML
    inputPlaceholder: Paste your YAML here...
    outputLabel: JSON from your YAML
    invalidYaml: Provided YAML is not valid.
    guide:
      intro: "YAML is popular for configuration files, while JSON is the common format for exchanging data between services. This tool converts YAML into formatted JSON as you type, which helps when checking a config structure or migrating data."
      usage: "Paste YAML into the input and the converted JSON appears immediately. Syntax errors in the YAML are reported."
      q1: "Are anchors and merge keys supported?"
      a1: "Yes. Anchors, aliases and merge keys are all expanded, so the result is complete JSON data."
      q2: "What happens with bad indentation?"
      a2: "YAML uses indentation to express nesting, so inconsistent indents or mixed tabs cause parse errors or a wrong structure. Indent with spaces consistently."
      q3: "Are comments kept?"
      a3: "No. JSON has no comments, so any comments in the YAML are dropped during conversion."
  uuid-generator:
    title: UUIDs generator
    description: A Universally Unique Identifier (UUID) is a 128-bit number used to identify information in computer systems. The number of possible UUIDs is 16^32, which is 2^128 or about 3.4x10^38 (which is a lot!).
    version: UUID version
    quantity: Quantity
    quantityPlaceholder: UUID quantity
    namespace: Namespace
    namespacePlaceholder: Namespace
    name: Name
    namePlaceholder: Name
    uuidsPlaceholder: Your uuids
    copied: UUIDs copied to the clipboard
    invalid: Invalid UUID
    guide:
      intro: "A UUID is a 128-bit unique identifier, commonly used for database keys, request tracing IDs and file names. This tool supports the NIL, v1, v3, v4 and v5 versions and can generate many at once."
      usage: "Pick a version and a quantity, and the results appear immediately, ready to copy. Versions v3 and v5 also need a namespace and a name, and the same inputs always produce the same UUID."
      q1: "Which version should I use?"
      a1: "v4 suits most cases because it is random. Use v5 when the same name must always map to the same UUID. v1 embeds its creation time, so the rough moment it was generated can be recovered from it, which also means that information is exposed."
      q2: "Can v4 UUIDs collide?"
      a2: "In theory, yes, but the odds are tiny. A v4 UUID has 122 random bits, so even at one billion per second it would take about 86 years to reach a fifty percent chance of a single collision."
      q3: "What is the NIL UUID?"
      a3: "A special UUID made entirely of zeros. It usually stands for an empty or unset value and is not unique by design."
