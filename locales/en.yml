    inputLabel: "MAC address:"
    inputPlaceholder: Type a MAC address
    sections:
      ula: "IPv6 ULA:"
      firstBlock: "First routable block:"
      lastBlock: "Last routable block:"
  hash-text:
    title: Hash text
    description: "Hash a text string using the function you need : MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 or RIPEMD160"
    inputLabel: "Your text to hash:"
    inputPlaceholder: Your string to hash...
    digestEncoding: Digest encoding
    encoding:
      bin: Binary (base 2)
      hex: Hexadecimal (base 16)
      base64: Base64 (base 64)
      base64url: Base64url (base 64 with url safe chars)
    guide:
      intro: "A hash function turns text of any length into a fixed-length digest, often used to verify file integrity or check whether two pieces of data match. This tool supports MD5, SHA1, SHA256, SHA224, SHA512, SHA384, SHA3 and RIPEMD160, all computed locally in your browser."
      usage: "Type some text and the results for every algorithm appear together. You can switch the digest output between hexadecimal, binary, Base64 and URL-safe Base64."
      q1: "Do hashes of non-English text match other tools?"
      a1: "Yes. Text is encoded as UTF-8 before hashing, the same default used by the Linux command line and mainstream programming languages."
      q2: "Why does the SHA3 result differ from other tools?"
      a2: "The SHA3 option here actually computes Keccak-512, the version that preceded the final SHA3 standard, so it does not match SHA3-512 as defined in FIPS 202. Keep this in mind when comparing against sha3-512 from OpenSSL and similar tools."
      q3: "Are MD5 and SHA1 still usable?"
      a3: "They are still fine for detecting accidental file corruption, but practical collision attacks exist, so they should not be used for digital signatures or password storage. For passwords use a dedicated algorithm such as Bcrypt."
