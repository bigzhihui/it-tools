    guide:
      intro: "Creates a QR code image from a URL, text or contact details, with custom foreground and background colours and an adjustable error correction level. Everything happens locally in your browser and your input is never uploaded."
      usage: "Type a link or some text and the QR code updates live. Adjust the colours and error correction, then click download to save it as a PNG image."
      q1: "Which error correction level should I choose?"
      a1: "Higher levels make the code readable even when part of it is covered or damaged, at the cost of a denser pattern. For printed posters, or when placing a logo in the middle, choose high or the highest level."
      q2: "How much content can a QR code hold?"
      a2: "At the lowest error correction level, about 7,000 digits or roughly 2,900 bytes of data, and a Chinese character takes 3 bytes in UTF-8. More content makes the pattern more complex, so keep it to a few hundred characters for reliable scanning."
      q3: "Can I use any colours?"
      a3: "Keep a dark foreground on a light background with enough contrast. When the foreground is lighter than the background or the contrast is low, many scanner apps fail to read the code."
