      copy: Copy
      refresh: Refresh
    guide:
      intro: "Quickly generates a random string of any length for use as a password, API key, invite code or test data, combining uppercase letters, lowercase letters, digits and symbols however you like."
      usage: "Tick the character types you want and drag the slider to set the length, and a token appears instantly. Click refresh for a new one, then copy it with a single click."
      q1: "Are the generated tokens secure?"
      a1: "Each character is drawn from the browser cryptographically secure random number generator, and everything happens locally without touching a server. For passwords, use at least 16 characters and mix character types."
      q2: "How long should a token be?"
      a2: "With upper and lower case letters plus digits, each character adds about 6 bits of randomness, so 16 characters give roughly 95 bits, enough to resist brute force. API keys usually use 32 characters or more."
      q3: "Why do some systems reject tokens with symbols?"
      a3: "Some systems restrict special characters, and others need them escaped in URLs or on the command line. In that case, untick symbols and increase the length a little to keep the same strength."
