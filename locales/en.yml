tools:
  pdf-merge:
    title: "Merge PDF"
    description: "Combine multiple PDF files into one in the order you choose, entirely in your browser. Files are never uploaded."
    uploadHint: "Drop PDF files here or click to choose. You can select several at once."
    privacy: "Files are processed in your browser and never uploaded to a server."
    totalPages: "{n} page in total | {n} pages in total"
    pages: "{n} page | {n} pages"
    clear: "Clear all"
    moveUp: "Move up"
    moveDown: "Move down"
    remove: "Remove"
    merge: "Merge and download"
    merging: "Merging..."
    needTwo: "Add at least two valid PDF files to merge"
    encrypted: "This file is encrypted and cannot be merged"
    invalid: "This file could not be read and may not be a valid PDF"
    mergeFailed: "Merge failed. Check the files and try again."
    guide:
      intro: "Combines several PDF files into one in the order you choose, which is handy for assembling contracts, reports and scans. Unlike many online tools that make you upload your files, this one works entirely in your browser, so the content never leaves your computer."
      usage: "Drop in or select several PDF files, reorder them with the move up and move down buttons, then click merge and download to get the combined file."
      q1: "Are my files uploaded?"
      a1: "No. Merging happens entirely in your browser without any server involved, which makes it suitable for sensitive documents such as contracts and IDs."
      q2: "Can encrypted PDFs be merged?"
      a2: "No. Pages of a password-protected file cannot be read, so it is marked as encrypted when added. Remove the protection with other software first, then merge."
      q3: "Does merging reduce quality?"
      a3: "No. Text and images on each page are copied as they are without re-compression, so quality matches the original files."
      q4: "Are bookmarks and forms kept?"
      a4: "Bookmarks are not kept, and fillable form fields may stop being interactive. The text, images and layout shown on each page are preserved in full."
  pdf-extract-pages:
    title: "Extract or delete PDF pages"
    description: "Keep only the pages you need, or delete the ones you don't, and download a new PDF. Runs in your browser, so files are never uploaded."
    uploadHint: "Drop a PDF file here or click to choose"
    privacy: "Files are processed in your browser and never uploaded to a server."
    pages: "{n} page | {n} pages"
    clear: "Remove file"
    mode: "Action"
    keep: "Keep these pages"
    delete: "Delete these pages"
    pagesLabel: "Pages"
    pagesPlaceholder: "e.g. 1-3, 5, 8-"
    pagesHint: "Separate with commas. 1-3 means pages 1 to 3, and 8- means page 8 to the end."
    syntax: "Use a format like 1-3, 5"
    outOfRange: "Page numbers must be from 1 to {n}"
    deletesAll: "You cannot delete every page. Keep at least one."
    summary: "{n} page in the new file | {n} pages in the new file"
    keepButton: "Extract and download"
    deleteButton: "Delete and download"
    working: "Processing..."
    encrypted: "This file is encrypted and cannot be processed"
    invalid: "This file could not be read and may not be a valid PDF"
    failed: "Something went wrong. Check the file and try again."
    guide:
      intro: "Takes the pages you need out of a PDF as a new file, or removes the ones you don't, such as pulling the signature page out of a contract or dropping blank pages from a scan. Everything happens in your browser, so the file is never uploaded to a server."
      usage: "Choose a PDF file, pick keep these pages or delete these pages, enter the page numbers, for example 1-3, 5, 8-, and click download. Separate entries with commas: 1-3 means pages 1 to 3, and 8- means page 8 to the end."
      q1: "Do deleted pages linger in the new file?"
      a1: "No. The new file contains only the pages you keep. Text and images from deleted pages are not carried over, and links pointing to those pages are removed."
      q2: "Can I change the page order?"
      a2: "Yes. When keeping pages, they appear in the order you type them, so 3, 1, 2 gives pages 3, 1 and 2 in that order. A page listed twice is included once."
      q3: "Can I type page numbers with Chinese punctuation?"
      a3: "Yes. Full-width commas, the Chinese enumeration comma, full-width digits and full-width dashes are all understood, for example 1－3，5."
      q4: "Can encrypted PDFs be processed?"
      a4: "No. Pages of a password-protected file cannot be read. Remove the protection with other software first."
      q5: "Are bookmarks and forms kept?"
      a5: "Bookmarks are not kept. Form fields keep what they currently show but can no longer be filled in. The text, images and layout of each page are preserved in full."
  pdf-rotate:
    title: "Rotate PDF"
    description: "Turn pages that face the wrong way, either every page or only the ones you choose. Runs in your browser, so files are never uploaded."
    uploadHint: "Drop a PDF file here or click to choose"
    privacy: "Files are processed in your browser and never uploaded to a server."
