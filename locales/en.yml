      mongoObjectId: Mongo ObjectID
      excelDateTime: Excel date/time
    guide:
      intro: "Developers constantly convert between timestamps and date formats. Enter one time here and get ISO 8601, RFC 3339, RFC 7231, Unix seconds and milliseconds, UTC, a MongoDB ObjectId and an Excel date all at once."
      usage: "Type a date string or a timestamp and the tool detects the format and fills in every result. You can also pick the input format yourself to avoid an ambiguous guess."
      q1: "How do I tell a seconds timestamp from a milliseconds one?"
      a1: "Count the digits. For the current time, a seconds timestamp has 10 digits and a milliseconds one has 13. JavaScript Date.now returns milliseconds, while many backend languages and databases use seconds."
      q2: "Which time zone are the results in?"
      a2: "The localized value uses your system time zone, and the ISO 8601 result includes your zone offset, such as +08:00. The UTC row shows Coordinated Universal Time. A timestamp itself has no time zone."
      q3: "How does a MongoDB ObjectId relate to time?"
      a3: "Its first 4 bytes are the creation time as a seconds timestamp, so you can recover when an ObjectId was made, or build an ObjectId prefix from a given time."
