about:
  content: |
    # About Thirteen Months Toolbox
    Thirteen Months Toolbox ([tools.afeiii.com](https://tools.afeiii.com)) aggregates handy online tools for developers and people working in IT. Purely client-side execution to safeguard your privacy. If you find it useful, please feel free to share it with your friends and bookmark it!
    This toolbox is free and open-source, continuously maintained with practical developer tools.
    ## Open Source Attribution & Copyright
    Thirteen Months Toolbox is based on the open-source project [IT-Tools](https://github.com/CorentinTh/it-tools) created by [Corentin Thomasset](https://github.com/CorentinTh), with localized enhancements and customized features.
    Licensed under open-source license, custom source code is hosted on [GitHub](https://github.com/bigzhihui/it-tools). Special thanks to the upstream author and the open-source community!
    ## Technologies
    Built with Vue 3, Vite, UnoCSS, and Naive UI for a fast, responsive, and elegant user experience.
    ## Found a bug? Feature request?
    If you found a bug or would like to request new tools, feel free to file an issue in our [GitHub Issues](https://github.com/bigzhihui/it-tools/issues).
