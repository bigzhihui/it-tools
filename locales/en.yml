      intro: "Turns minified or badly indented JSON into a clean, readable layout, which is handy for inspecting API responses and debugging config files. Everything runs locally in your browser and nothing is uploaded."
      usage: "Paste raw JSON and the formatted result appears instantly. You can change the indent size and toggle key sorting, which orders object fields alphabetically and makes two JSON documents easier to compare."
      q1: "Can it parse JSON with comments or trailing commas?"
      a1: "Yes. Input is parsed with JSON5, so comments, trailing commas, single-quoted strings and unquoted keys are accepted. The output is always standard JSON."
      q2: "What should I do when it says the JSON is invalid?"
      a2: "The usual causes are unbalanced brackets or quotes, a missing colon between a key and its value, or stray characters picked up while copying. Removing sections one at a time quickly narrows down the problem."
      q3: "Does sorting keys change my data?"
      a3: "No. It only changes the order in which object fields are shown, including nested objects. The order of items inside arrays is left untouched."
