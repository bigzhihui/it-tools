    guide:
      intro: "Planning a network or writing firewall rules often means working out the usable range of a subnet. Enter an IP address and mask to get the network address, broadcast address, subnet mask, wildcard mask and number of usable hosts."
      usage: "Enter an address with a mask, such as 192.168.1.10/24, and the results appear immediately. An address without a mask is treated as a single host, which is /32. You can also jump to the previous or next adjacent subnet."
      q1: "How many addresses does /24 contain?"
      a1: "A /24 uses the first 24 bits for the network and the remaining 8 for hosts, giving 256 addresses. After the network and broadcast addresses, 254 can be assigned to hosts."
      q2: "What is a wildcard mask for?"
      a2: "A wildcard mask is the subnet mask with every bit inverted, used in Cisco access control lists and OSPF configuration. For example, the subnet mask 255.255.255.0 corresponds to the wildcard mask 0.0.0.255."
      q3: "Why is there no broadcast address?"
      a3: "With a /31 or /32 mask the subnet holds only two addresses or one, so no broadcast address is reserved. A /31 is common on point-to-point links."
