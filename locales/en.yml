  url-encoder:
    title: Encode/decode URL-formatted strings
    description: Encode text to URL-encoded format (also known as "percent-encoded"), or decode from it.
    yourString: "Your string :"
    stringToEncodePlaceholder: The string to encode
    stringEncoded: "Your string encoded :"
    stringEncodedPlaceholder: Your string encoded
    copiedEncoded: Encoded string copied to the clipboard
