      mockingcase: "Mockingcase:"
    guide:
      intro: "Different parts of a codebase call for different naming styles, such as camelCase for variables, PascalCase for classes and CONSTANT_CASE for constants. Type once here and get 14 naming formats at the same time."
      usage: "Enter any string or an existing identifier and every format is generated together, ready to copy. Word boundaries are detected automatically, so userName, user_name and user-name all split correctly."
      q1: "Where is each format used?"
      a1: "camelCase is common for JavaScript variables and functions, PascalCase for classes and components, snake_case for Python and database columns, CONSTANT_CASE for constants and environment variables, and kebab-case for URLs and CSS class names."
      q2: "What happens to non-Latin characters and digits?"
      a2: "Formats such as camelCase and snake_case keep only Latin letters, so non-Latin characters and digits are treated as separators and removed. Lowercase, uppercase and mocking case keep the original text intact."
      q3: "What is mocking case?"
      a3: "Letters alternate between upper and lower case one character at a time, so hello world becomes HeLlO WoRlD. It is mostly used online to convey a teasing tone and rarely needed in code."
  html-entities:
    title: Escape HTML entities
    description: Escape or unescape HTML entities (replace characters like <,>, &, " and \' with their HTML version)
