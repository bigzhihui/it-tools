      listValues: List of values
      minutes1And10: At minutes 1 and 10
      stepValues: Step values
      every10Minutes: Every 10 minutes
      yearly: Once every year at midnight of 1 January
      sameAsYearly: Same as {'@'}yearly
      monthly: Once a month at midnight on the first day
      weekly: Once a week at midnight on Sunday morning
      daily: Once a day at midnight
      sameAsDaily: Same as {'@'}daily
      hourly: Once an hour at the beginning of the hour
      reboot: Run at startup
    guide:
      intro: "A cron expression uses five fields to describe when a scheduled job runs, and one wrong field can make it fire at the wrong time. This tool validates the expression as you type and translates it into a plain description."
      usage: "Type a cron expression and its meaning appears straight away, such as what time each day it runs or how often it repeats. A reference of symbols for each field is included on the page."
      q1: "What do the five fields mean?"
      a1: "From left to right: minute, hour, day of month, month and day of week. For example, 30 2 * * 1 runs at 2:30 in the morning every Monday."
      q2: "Is Sunday 0 or 7?"
      a2: "Most implementations accept both 0 and 7 for Sunday. This tool counts from 0 by default, which you can change in the options."
      q3: "The expression is correct, so why does the job not run on time?"
      a3: "Common causes are a server time zone that differs from what you expect, or environment variables that differ between cron and your interactive shell. Check the server time zone first, then the job logs."
