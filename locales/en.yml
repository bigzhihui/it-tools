    guide:
      intro: "Base64 represents arbitrary data using printable characters and is common in email attachments, data URLs and API payloads. This tool encodes and decodes in both directions, entirely in your browser."
      usage: "Type text in the encode panel to get its Base64 form, or paste a Base64 string in the decode panel to recover the original. If the result will go into a URL or a file name, enable URL-safe mode, which swaps plus and slash for hyphen and underscore and drops the trailing equals signs."
      q1: "Will non-English text come out garbled?"
      a1: "No. Text is handled as UTF-8, so Chinese characters and emoji encode and decode correctly, matching the default behaviour of mainstream programming languages."
      q2: "Can Base64 be used for encryption?"
      a2: "No. Base64 is only an encoding and anyone can decode it, so it provides no confidentiality. Use an encryption tool when data needs to be protected."
      q3: "Why is the encoded output longer?"
      a3: "Base64 uses 4 characters for every 3 bytes, so the output is about four thirds the size of the input, sometimes with equals signs added at the end as padding."
