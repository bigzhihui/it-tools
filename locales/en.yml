    unknown: Unknown
    guide:
      intro: "Converts between HEX, RGB, HSL, HWB, LCH, LAB, CMYK and CSS colour names. Change any one format and the rest update to match, which suits front-end work and picking colours from designs."
      usage: "Pick a colour with the colour picker, or type a value into any format field, and every other format is calculated immediately."
      q1: "What is the difference between HSL and RGB?"
      a1: "RGB describes a colour with red, green and blue components, close to how screens display it. HSL uses hue, saturation and lightness, which matches how people think about colour and makes adjusting brightness or vividness easier."
      q2: "Can I use the CMYK values for printing?"
      a2: "Only as a guide. Screens and printers cover different colour ranges, and accurate print colours depend on the specific colour profile and printing device."
      q3: "Why does a colour name come up as unknown?"
      a3: "Only standard CSS colour names are supported, such as red, olive or steelblue. Names in other languages or custom swatch names from design software are not recognised."
  bcrypt:
    title: Bcrypt
    description: Hash and compare text string using bcrypt. Bcrypt is a password-hashing function based on the Blowfish cipher.
    hashTitle: Hash
    yourString: "Your string:"
    inputPlaceholder: Your string to bcrypt...
    saltCount: "Salt count:"
    saltPlaceholder: Salt rounds...
    copyHash: Copy hash
    copied: Hashed string copied to the clipboard
    compareTitle: Compare string with hash
    compareString: "Your string:"
    compareStringPlaceholder: Your string to compare...
    compareHash: "Your hash:"
    compareHashPlaceholder: Your hash to compare...
    doTheyMatch: Do they match ?
    yes: Yes
    no: No
    guide:
      intro: "Bcrypt is a hashing algorithm designed for storing passwords. It includes a random salt and a cost factor that controls how slow it is, raising the price of brute-force attacks. This tool creates Bcrypt hashes and checks whether a password matches a hash."
      usage: "Enter text and choose the number of rounds in the hash panel to create a hash. In the compare panel, enter a password and an existing hash to see whether they match."
      q1: "Why does the same password give a different hash each time?"
      a1: "A new random salt is generated every time and stored inside the hash. Verification reads the salt back out of the hash before computing, so every one of those hashes still matches the same password."
      q2: "How many rounds should I use?"
      a2: "Each additional round roughly doubles the computation time. A value of 10 to 12 is generally recommended as a balance between security and login response time."
      q3: "Does Bcrypt limit password length?"
      a3: "Yes. Bcrypt only uses the first 72 bytes of a password and ignores the rest. Note that a Chinese character takes 3 bytes in UTF-8."
  crontab-generator:
    title: Crontab generator
    description: Validate and generate crontab and get the human-readable description of the cron schedule.
    invalid: This cron is invalid
    verbose: Verbose
    use24Hour: Use 24 hour time format
    daysStartAtZero: Days start at 0
    symbol: Symbol
    meaning: Meaning
    example: Example
    equivalent: Equivalent
    meanings:
      anyValue: Any value
      everyMinute: Every minute
      rangeValues: Range of values
