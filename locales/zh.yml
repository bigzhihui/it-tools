      iat: 签发时间 (Issued At)
      jti: JWT 唯一标识
      name: 姓名
      email: 电子邮箱
    guide:
      intro: "JWT 是一种常见的身份凭证格式，由头部、负载和签名三段组成。本工具把 JWT 解码成可读内容，并对签发者、过期时间等标准字段给出说明。解码在浏览器本地进行，令牌不会被上传。"
      usage: "把完整的 JWT 粘贴进输入框，头部和负载会分别以表格展示，过期时间、生效时间和签发时间会换算成可读的日期。"
      q1: "这个工具会验证 JWT 的签名吗？"
      a1: "不会。本工具只做解码，不校验签名，因此无法判断令牌是否被篡改。服务端在信任一个 JWT 之前，必须用密钥验证它的签名。"
      q2: "JWT 的负载是加密的吗？"
      a2: "不是。负载只经过 Base64URL 编码，任何拿到令牌的人都能直接读出内容，所以不要在 JWT 里存放密码等敏感信息。"
      q3: "把生产环境的令牌粘贴进来安全吗？"
      a3: "解码完全在你的浏览器里完成，令牌不会发送到任何服务器。但一个有效的令牌本身就是登录凭证，仍应避免在不受信任的地方粘贴或分享。"
  date-converter:
    title: 日期时间转换器
    description: 将日期和时间转换为各种不同的格式
    inputPlaceholder: 请输入日期时间字符串或时间戳...
    invalidDate: 无效的日期时间格式...
    invalidForFormat: 此日期与当前选择的格式不匹配
    formats:
      jsLocale: 本地化日期时间 (JS Locale)
      iso8601: ISO 8601
      iso9075: ISO 9075
      rfc3339: RFC 3339
      rfc7231: RFC 7231
      unixTimestamp: Unix 秒级时间戳 (Seconds)
      timestamp: 毫秒级时间戳 (Milliseconds)
      utcFormat: UTC 国际标准时间
      mongoObjectId: MongoDB ObjectId
      excelDateTime: Excel 日期时间格式
    guide:
      intro: "开发中经常需要在时间戳和各种日期格式之间来回转换。本工具输入一个时间，就能同时得到 ISO 8601、RFC 3339、RFC 7231、Unix 秒级与毫秒级时间戳、UTC 时间、MongoDB ObjectId 和 Excel 日期等多种表示。"
      usage: "在输入框填入日期字符串或时间戳，工具会自动识别格式并换算出所有结果。也可以手动指定输入格式，避免自动识别出现歧义。"
      q1: "秒级和毫秒级时间戳怎么区分？"
      a1: "看位数。当前时间的秒级时间戳是 10 位，毫秒级是 13 位。JavaScript 的 Date.now 返回毫秒，许多后端语言和数据库则常用秒。"
      q2: "结果显示的是哪个时区？"
      a2: "本地化时间按你电脑的系统时区显示，ISO 8601 结果带有所在时区的偏移量，例如 +08:00。UTC 一栏才是协调世界时。时间戳本身与时区无关。"
      q3: "MongoDB ObjectId 和时间有什么关系？"
      a3: "ObjectId 的前 4 个字节是创建时的秒级时间戳，所以能从 ObjectId 还原出它的生成时间，反过来也能根据时间构造出 ObjectId 的前缀。"
