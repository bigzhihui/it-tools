      usage: "可以用拾色器直接选色，也可以在任意一种格式的输入框里填入颜色值，其余格式会立即换算出来。"
      q1: "HSL 和 RGB 有什么区别？"
      a1: "RGB 用红、绿、蓝三个分量描述颜色，贴近屏幕的显示原理。HSL 用色相、饱和度和亮度描述，更符合人对颜色的直觉，调整明暗或鲜艳程度时更方便。"
      q2: "CMYK 结果能直接用于印刷吗？"
      a2: "只能作为参考。屏幕颜色和印刷颜色的色域不同，准确的印刷色需要依赖具体的色彩配置文件和印刷设备。"
      q3: "输入颜色名时提示未知颜色？"
      a3: "支持的是 CSS 标准颜色名，例如 red、olive、steelblue。中文颜色名或设计软件里的自定义色名无法识别。"
  bcrypt:
    title: Bcrypt 哈希与比对
    description: 使用bcrypt对文本字符串进行哈希和比较。Bcrypt是一个基于Blowfish密码的密码哈希函数。
    hashTitle: Bcrypt 哈希计算
    yourString: 源字符串：
    inputPlaceholder: 请输入需要 Bcrypt 加密的字符串...
    saltCount: Salt 轮数 (Cost)：
    saltPlaceholder: Salt rounds 轮数...
    copyHash: 复制 Bcrypt 哈希
    copied: Bcrypt 哈希已复制到剪贴板
    compareTitle: 比对明文与 Bcrypt 哈希
    compareString: 待验证明文：
    compareStringPlaceholder: 输入需要比对的明文字符串...
    compareHash: 待验证哈希：
    compareHashPlaceholder: 输入需要比对的 Bcrypt 哈希...
    doTheyMatch: 是否完全匹配？
    yes: 匹配 (Yes)
    no: 不匹配 (No)
    guide:
      intro: "Bcrypt 是专为存储密码设计的哈希算法，内置随机盐值，并能通过成本因子控制计算速度，让暴力破解的代价随之提高。本工具可以生成 Bcrypt 哈希，也能校验明文与哈希是否匹配。"
      usage: "在哈希区输入明文并设置轮数，即可生成哈希值。在比对区分别填入明文和已有的哈希，工具会显示两者是否匹配。"
      q1: "为什么同一个密码每次生成的哈希都不一样？"
      a1: "因为每次都会生成新的随机盐值，并写进哈希结果里。校验时会先从哈希中读出盐值再计算，所以这些不同的哈希都能正确匹配同一个密码。"
      q2: "轮数设置多少合适？"
      a2: "轮数每增加 1，计算时间大约翻一倍。一般建议设为 10 到 12，在安全性和登录响应速度之间取得平衡。"
      q3: "Bcrypt 对密码长度有限制吗？"
      a3: "有。Bcrypt 只使用密码的前 72 个字节，超出的部分会被忽略。一个中文字符在 UTF-8 下占 3 个字节。"
  crontab-generator:
    title: Crontab 表达式生成器
    description: 验证并生成 crontab 表达式，并获取 cron 定时周期的中文可读描述。
    invalid: 此 Cron 表达式格式无效
    verbose: 详细描述
    use24Hour: 使用 24 小时制
    daysStartAtZero: 星期天从 0 开始
    symbol: 符号
    meaning: 含义
    example: 示例
    equivalent: 等效描述
    meanings:
      anyValue: 任何值
      everyMinute: 每分钟
      rangeValues: 连续范围值
      minutes1Through10: 第 1 到 10 分钟
      listValues: 离散列表值
      minutes1And10: 第 1 和第 10 分钟
      stepValues: 步进间隔值
      every10Minutes: 每隔 10 分钟
      yearly: 每年 1 月 1 日午夜运行一次
      sameAsYearly: 同 {'@'}yearly
      monthly: 每月 1 日午夜运行一次
      weekly: 每周日午夜运行一次
      daily: 每天午夜运行一次
      sameAsDaily: 同 {'@'}daily
      hourly: 每小时整点运行一次
      reboot: 系统开机/重启时运行
    guide:
      intro: "Cron 表达式用五个字段描述定时任务的执行周期，写错一位就可能让任务在错误的时间运行。本工具实时校验表达式，并把它翻译成易懂的中文描述。"
      usage: "在输入框填写 Cron 表达式，下方会立即显示它的含义，例如每天几点执行、每隔多久执行。页面还附有各字段的符号说明，方便对照编写。"
      q1: "五个字段分别代表什么？"
      a1: "从左到右依次是分钟、小时、日、月、星期。例如 30 2 * * 1 表示每周一凌晨两点半执行。"
      q2: "星期天是 0 还是 7？"
      a2: "在大多数实现中，0 和 7 都表示星期天。本工具默认从 0 开始计算，可以在选项中调整。"
      q3: "表达式写对了，为什么任务没有按时执行？"
      a3: "常见原因是服务器时区与预期不同，或者定时任务运行时的环境变量与手动执行命令时不一致。建议先确认服务器时区，再检查任务日志。"
