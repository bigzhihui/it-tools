      ipClass: IP 地址分类 (IP class)
      unknownClassFallback: 未知类别
    previousBlock: 上一个子网段
    nextBlock: 下一个子网段
    guide:
      intro: "规划网络或配置防火墙规则时，经常需要算出一个网段的可用地址范围。本工具输入 IP 地址和掩码，就能得到网络地址、广播地址、子网掩码、通配符掩码和可用主机数量。"
      usage: "输入带掩码的地址，例如 192.168.1.10/24，结果会立即显示。只输入地址时按单个主机，也就是 /32 计算。还可以一键切换到上一个或下一个相邻网段。"
      q1: "/24 表示多少个地址？"
      a1: "/24 表示前 24 位是网络部分，剩下 8 位用于主机，共 256 个地址。扣除网络地址和广播地址后，可分配给主机的有 254 个。"
      q2: "通配符掩码有什么用？"
      a2: "通配符掩码是子网掩码按位取反的结果，常用于思科等设备的访问控制列表和 OSPF 配置。例如子网掩码 255.255.255.0 对应的通配符掩码是 0.0.0.255。"
      q3: "为什么显示没有广播地址？"
      a3: "掩码为 /31 或 /32 时，网段只有两个或一个地址，按规范不再保留广播地址。/31 常用于点对点链路。"
