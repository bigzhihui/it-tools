    guide:
      intro: "编写正则表达式时，边写边看匹配结果能大幅减少试错时间。本工具实时显示匹配位置、捕获分组和命名分组，还能生成正则语法图和随机匹配样本。"
      usage: "输入正则表达式和待匹配的文本，匹配结果会实时列出。通过开关可以启用全局、忽略大小写、多行、单行和 Unicode 等匹配模式。"
      q1: "这里测试的是哪种正则语法？"
      a1: "JavaScript 的正则引擎，行为与浏览器和 Node.js 一致。其他语言的语法大体相同，但在命名分组的写法、后行断言支持等细节上可能存在差异。"
      q2: "为什么只匹配到了第一个结果？"
      a2: "需要开启全局匹配，也就是 g 模式。不开启时，正则只会返回第一个匹配项。"
      q3: "多行模式和单行模式有什么区别？"
      a3: "多行模式让行首和行尾锚点匹配每一行的开头和结尾，单行模式让点号也能匹配换行符。两者作用不同，可以同时开启。"
