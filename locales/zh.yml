  hash-text:
    title: Hash 文本
    description: 使用所需的函数哈希文本字符串：MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3或RIPEMD160
    inputLabel: 待计算 Hash 的文本：
    inputPlaceholder: 请输入需要计算 Hash 的字符串...
    digestEncoding: 摘要编码格式
    encoding:
      bin: 二进制 (Binary - base 2)
      hex: 十六进制 (Hexadecimal - base 16)
      base64: Base64 (base 64)
      base64url: Base64URL (URL 安全的 base 64)
    guide:
      intro: "哈希函数把任意长度的文本转换成固定长度的摘要，常用于校验文件完整性、比对数据是否一致。本工具支持 MD5、SHA1、SHA256、SHA224、SHA512、SHA384、SHA3 和 RIPEMD160，计算全部在浏览器本地进行。"
      usage: "输入文本后，所有算法的结果会同时显示。可以切换摘要的输出格式，包括十六进制、二进制、Base64 和 URL 安全的 Base64。"
      q1: "中文的哈希结果和其他工具一致吗？"
      a1: "一致。文本先按 UTF-8 编码再计算，与 Linux 命令行和主流编程语言的默认行为相同。"
      q2: "为什么这里的 SHA3 结果和别的工具对不上？"
      a2: "本工具的 SHA3 选项实际计算的是 Keccak-512，也就是 SHA3 正式标准化之前的版本，与 FIPS 202 定义的 SHA3-512 结果不同。和 OpenSSL 等工具的 sha3-512 比对时，请注意这一差异。"
      q3: "MD5 和 SHA1 还能用吗？"
      a3: "用来校验文件是否被意外损坏仍然可以，但它们已被证明存在碰撞攻击，不应再用于数字签名或密码存储。存储密码请使用 Bcrypt 这类专用算法。"
