    guide:
      intro: "把多张图片按顺序合成一个 PDF，每张图片占一页，常用于提交证件照、发票照片和用手机拍下的纸质文件。处理完全在浏览器本地进行，图片不会上传到任何服务器，适合身份证、合同这类敏感材料。"
      usage: "拖入或选择图片，用上移和下移按钮调整顺序，选择页面大小，然后点击生成 PDF 并下载。选择 A4 时还可以设置页边距。"
      q1: "图片会被上传吗？"
      a1: "不会。图片的读取和 PDF 的生成都在你的浏览器中完成，不经过任何服务器。"
      q2: "支持哪些图片格式？"
      a2: "支持 JPG、PNG，以及 WebP、GIF、BMP 等浏览器能打开的格式。GIF 动图只保留第一帧。iPhone 的 HEIC 照片在多数浏览器中无法读取，可先转换为 JPG。"
      q3: "手机拍的照片方向会不会错？"
      a3: "不会。照片会按手机记录的拍摄方向自动摆正，与在相册中看到的方向一致。"
      q4: "图片清晰度会降低吗？"
      a4: "不会。JPG 图片原样放入 PDF，不会重新压缩；PNG 和其他格式的图片按原始像素无损放入。"
      q5: "页面大小怎么选？"
      a5: "选择与图片相同时，每页尺寸与对应图片一致，适合在屏幕上阅读。选择 A4 时，图片按比例缩放并居中，适合打印。"
