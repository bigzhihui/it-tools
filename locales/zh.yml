    title: IPv6 ULA 本地唯一地址生成器
    description: 遵循 RFC 4193 标准规范，基于时间戳与 MAC 地址生成局域网不可公网路由的 IPv6 唯一本地地址 (ULA)。
    infoTitle: 关于生成算法
    infoDesc: 本工具采用 IETF 推荐的第一种标准算法：将当前高精度时间戳与 MAC 地址进行 SHA-1 哈希运算，提取低 40 位生成全局唯一的随机 ULA 网段。
    inputLabel: MAC 地址：
