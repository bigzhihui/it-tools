      intro: "快速生成指定长度的随机字符串，可用作密码、API 密钥、邀请码或测试数据，并能自由组合大写字母、小写字母、数字和符号。"
      usage: "勾选需要的字符类型，拖动滑块设置长度，令牌会立即生成。不满意可以点击刷新重新生成，确认后一键复制。"
      q1: "生成的令牌够安全吗？"
      a1: "令牌使用浏览器提供的加密安全随机数生成器逐位抽取，并且全程在本地生成，不会经过任何服务器。用作密码时，建议长度不少于 16 位，并包含多种字符类型。"
      q2: "令牌要多长才够用？"
      a2: "同时包含大小写字母和数字时，每一位约提供 6 位随机性，16 位长度约有 95 位随机性，足以抵御暴力破解。API 密钥通常取 32 位以上。"
      q3: "为什么有些系统不接受带符号的令牌？"
      a3: "部分系统限制特殊字符，或者在网址和命令行中需要额外转义。遇到这种情况可以取消勾选符号，再适当增加长度来弥补强度。"
