    title: 大小写转换
    description: 更改字符串的大小写并在不同格式之间进行选择
    inputLabel: 源字符串：
    inputPlaceholder: 在此输入待转换的字符串...
    formats:
      lowercase: "全小写 (Lowercase):"
      uppercase: "全大写 (Uppercase):"
      camelcase: "小驼峰 (Camelcase):"
      capitalcase: "首字母大写 (Capitalcase):"
      constantcase: "常量大写 (Constantcase):"
      dotcase: "点号分隔 (Dotcase):"
      headercase: "请求头风格 (Headercase):"
      nocase: "无格式空格 (Nocase):"
      paramcase: "短横线/烤串 (Paramcase):"
      pascalcase: "大驼峰/帕斯卡 (Pascalcase):"
      pathcase: "路径斜杠 (Pathcase):"
      sentencecase: "句首大写 (Sentencecase):"
      snakecase: "下划线/蛇形 (Snakecase):"
      mockingcase: "嘲讽波浪交替 (Mockingcase):"
    guide:
      intro: "编程中不同场景要求不同的命名风格，例如变量用小驼峰、类名用大驼峰、常量用全大写加下划线。本工具输入一次，就能同时得到 14 种命名格式。"
      usage: "输入任意字符串或现有的变量名，各种格式会同时生成，可以直接复制。工具会自动识别单词边界，userName、user_name 和 user-name 都能被正确拆分。"
      q1: "各种格式分别用在哪里？"
      a1: "小驼峰常用于 JavaScript 变量和函数，大驼峰用于类名和组件名，下划线格式常见于 Python 和数据库字段，全大写下划线用于常量和环境变量，短横线格式常用于网址和 CSS 类名。"
      q2: "中文和数字能转换吗？"
      a2: "驼峰、下划线等格式只保留拉丁字母，中文和数字都会被当作分隔符去掉。全小写、全大写和嘲讽格式则会完整保留原文。"
      q3: "嘲讽格式是什么？"
      a3: "大小写逐个字符交替的写法，例如 hello world 会变成 HeLlO WoRlD，多用于网络上表达调侃语气，开发中一般用不到。"
  html-entities:
    title: HTML 实体转义/反转义
    description: 转义或还原 HTML 实体（将 <、>、&、" 和 \' 替换为其对应的 HTML 实体编码，反之亦然）。
    escapeCardTitle: 转义 HTML 实体 (Escape)
