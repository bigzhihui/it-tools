      usage: "在左侧粘贴原始文本，在右侧粘贴修改后的文本，差异会逐行高亮显示。两侧都可以直接编辑，结果实时更新。"
      q1: "对比的文本会被上传吗？"
      a1: "不会。对比完全在浏览器本地完成，适合处理包含敏感信息的代码或配置。"
      q2: "能对比多大的文本？"
      a2: "普通代码文件和文档都能流畅对比。文本达到数万行时，渲染会明显变慢，建议分段对比。"
      q3: "对比是按行还是按字符？"
      a3: "先按行找出发生变化的部分，再在这些行内标出具体改动的字符，方便定位细微的差异。"
