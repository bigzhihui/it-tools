      intro: "把 PDF 中方向不对的页面转正，例如扫描时放反的合同，或横向排版的表格页。可以旋转全部页面，也可以只旋转指定页面。处理完全在浏览器本地进行，文件不会上传到任何服务器。"
      usage: "选择一个 PDF 文件，选好旋转方向，再选择旋转全部页面或只旋转指定页面，然后点击旋转并下载。指定页面时，页码写法与打印时相同，例如 1-3, 5。"
      q1: "旋转会降低清晰度吗？"
      a1: "不会。旋转只改变页面的显示方向，页面上的文字和图片不会被重新压缩。"
      q2: "书签、链接和表单会保留吗？"
      a2: "会。旋转直接修改原文件中页面的方向，书签、链接和表单等其他内容保持不变。"
      q3: "页面原本已经旋转过，会怎样？"
      a3: "会在页面当前的方向上继续旋转。例如已经向右旋转 90° 的页面，再向右旋转 90° 后就是倒置的。"
      q4: "数字签名还有效吗？"
      a4: "不再有效。旋转会修改文件内容，原有的数字签名会失效，需要时请重新签名。"
      q5: "加密的 PDF 能旋转吗？"
      a5: "不能。设置了密码的文件无法读取页面，需要先用其他软件解除加密。"
