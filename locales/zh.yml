      a1: "不会。页面的渲染和图片的生成都在你的浏览器中完成，不经过任何服务器。"
      q2: "选 JPG 还是 PNG？"
      a2: "JPG 文件更小，适合照片和扫描件；PNG 是无损格式，文字和线条的边缘更清晰，适合文档和图表。"
      q3: "分辨率怎么选？"
      a3: "150 DPI 适合在屏幕上查看和发送，300 DPI 适合打印。分辨率越高，图片越清晰，文件也越大。页面特别大时，为避免超出浏览器的处理能力，会自动适当降低分辨率。"
      q4: "可以一次下载全部图片吗？"
      a4: "可以。点击打包下载 ZIP，所有图片会放进一个压缩包，文件名按页码排序。"
      q5: "有密码的 PDF 能转换吗？"
      a5: "只限制了编辑或打印的 PDF 可以直接转换；需要输入密码才能打开的文件无法转换，需要先用其他软件解除密码。"
