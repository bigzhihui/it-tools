      usage: "粘贴原始 JSON 后会实时得到格式化结果。可以调整缩进空格数，也可以开关按键名排序，让对象字段按字母顺序排列，方便对比两段 JSON。"
      q1: "带注释或末尾逗号的 JSON 能解析吗？"
      a1: "能。本工具使用 JSON5 解析，兼容注释、末尾逗号、单引号字符串和不带引号的键名，输出时统一转换为标准 JSON。"
      q2: "提示格式无效怎么办？"
      a2: "常见原因是括号或引号没有成对闭合、键值之间缺少冒号，或者粘贴时混入了多余字符。逐段删减内容，可以快速定位出错的位置。"
      q3: "按键名排序会改变数据吗？"
      a3: "不会改变数据内容，只调整对象中字段的显示顺序，嵌套对象同样生效。数组里元素的顺序保持不变。"
