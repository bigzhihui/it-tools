    copied: UUID 已成功复制到剪贴板
    invalid: 无效的 UUID 格式
    guide:
      intro: "UUID 是一个 128 位的唯一标识符，常用作数据库主键、请求追踪编号和文件名。本工具支持 NIL、v1、v3、v4、v5 五种版本，并且可以批量生成。"
      usage: "选择版本并设置生成数量，结果会立即显示并可一键复制。v3 和 v5 需要额外填写命名空间和名称，相同的输入总会得到相同的 UUID。"
      q1: "应该选哪个版本？"
      a1: "一般场景用 v4 即可，它基于随机数生成。需要根据同一个名称稳定得到同一个 UUID 时用 v5。v1 内含生成时间等信息，可以从中还原大致的生成时刻，这也意味着会暴露这些信息。"
      q2: "v4 会重复吗？"
      a2: "理论上可能，但概率极低。v4 有 122 位随机部分，即使每秒生成十亿个，也要持续大约 86 年，才有一半的概率出现一次重复。"
      q3: "NIL UUID 是什么？"
      a3: "全部由 0 组成的特殊 UUID，通常用来表示「空值」或「未设置」，本身不具备唯一性。"
