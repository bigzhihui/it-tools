  url-encoder:
    title: 编码/解码url格式的字符串
    description: 编码为url编码格式（也称为“百分比编码”）或从中解码。
    yourString: 源字符串：
    stringToEncodePlaceholder: 需要编码的字符串
    stringEncoded: 编码后结果：
    stringEncodedPlaceholder: URL 编码后的字符串
    copiedEncoded: URL 编码字符串已复制到剪贴板
    encodedString: 待解码的 URL 编码字符串：
    stringToDecodePlaceholder: 需要解码的字符串
    stringDecoded: 解码后结果：
    stringDecodedPlaceholder: 解码后的字符串
    copiedDecoded: 解码后字符串已复制到剪贴板
    parseError: 无法解析此字符串
    guide:
      intro: "网址中只能直接使用一部分字符，中文、空格和许多符号需要转成百分号编码才能安全传输。本工具可以在原始字符串和 URL 编码之间双向转换。"
      usage: "在编码区输入原始字符串，即可得到百分号编码后的结果。在解码区粘贴形如 %E4%BD%A0 的编码串，即可还原为可读文本。"
      q1: "为什么空格被编码成 %20 而不是加号？"
      a1: "本工具采用 encodeURIComponent 规则，空格统一编码为 %20。用加号表示空格是表单提交的写法，大多数服务端对两者都能正确识别。"
      q2: "哪些字符不会被编码？"
      a2: "字母、数字以及 - _ . ! ~ * ' ( ) 这几个符号保持原样，其余字符都会被编码，包括斜杠、问号和等号，因此它适合处理网址中的单个参数值。"
      q3: "解码时提示无法解析是什么原因？"
      a3: "通常是百分号后面跟的不是合法的十六进制，或者多字节字符的编码被截断了一部分。请检查编码串是否完整。"
