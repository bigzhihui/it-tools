      q1: "容错率该怎么选？"
      a1: "容错率越高，二维码被遮挡或污损时越容易识别，但图案也会更密集。印在海报上，或者要在中间放 Logo 时，建议选高或最高。"
      q2: "二维码最多能存多少内容？"
      a2: "在最低容错率下，纯数字最多约 7000 位，字节数据约 2900 字节，一个中文字符按 UTF-8 占 3 个字节。内容越多图案越复杂，建议控制在几百个字符以内，以保证扫码成功率。"
      q3: "颜色可以随便设置吗？"
      a3: "建议保持深色前景、浅色背景，并留出足够的对比度。前景比背景浅或者对比度太低时，很多扫码软件会无法识别。"
