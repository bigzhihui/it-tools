  base-converter:
    title: 整数基转换器
    description: 在不同的基数（十进制、十六进制、二进制、八进制、base64…）之间转换数字
    guide:
      intro: "在二进制、八进制、十进制和十六进制之间转换整数，也支持 2 到 64 之间的任意进制，常用于查看位运算结果、权限码或颜色值。"
      usage: "输入数字并指定它当前的进制，各种进制的结果会同时显示。需要其他进制时，可以在自定义一栏设置目标基数。本工具支持任意大小的整数。"
      q1: "输入大写的十六进制为什么提示无效？"
      a1: "本工具的进制字符区分大小写，36 进制以内请使用小写字母，例如输入 ff 而不是 FF。更高的进制才会用到大写字母。"
      q2: "支持负数和小数吗？"
      a2: "不支持。本工具只处理非负整数，输入负号或小数点会被提示为无效字符。"
      q3: "64 进制和 Base64 编码是一回事吗？"
      a3: "不是。这里的 64 进制是对整数做进位换算，而 Base64 编码是把任意字节数据转换成文本，两者的字符顺序和用途都不相同。"
  yaml-to-json-converter:
    title: YAML到JSON转换器
    description: 使用此在线转换器将YAML转换为JSON。
    inputLabel: YAML 内容
    inputPlaceholder: 在此粘贴 YAML 内容...
    outputLabel: 转换后的 JSON
    invalidYaml: 提供的 YAML 内容格式无效。
    guide:
      intro: "YAML 常用于配置文件，JSON 则是接口和程序之间交换数据的通用格式。本工具把 YAML 实时转换为格式化的 JSON，方便检查配置结构或迁移数据。"
      usage: "把 YAML 内容粘贴进输入框，转换后的 JSON 会立即显示。如果 YAML 有语法错误，会给出提示。"
      q1: "支持锚点和合并键吗？"
      a1: "支持。YAML 中的锚点、引用和合并键都会被展开，转换结果是完整的 JSON 数据。"
      q2: "缩进出错会怎样？"
      a2: "YAML 依靠缩进表示层级，缩进不一致或者混用制表符，会导致解析失败或层级错乱。请统一使用空格缩进。"
      q3: "注释会被保留吗？"
      a3: "不会。JSON 本身不支持注释，转换时 YAML 里的注释会被丢弃。"
