    mergeFailed: "合并失败，请检查文件后重试"
    guide:
      intro: "把多个 PDF 文件按你指定的顺序合并成一个，常用于整理合同、报告和扫描件。与许多需要上传文件的在线工具不同，本工具完全在浏览器本地处理，文件内容不会离开你的电脑。"
      usage: "拖入或选择多个 PDF 文件，用列表中的上移和下移按钮调整顺序，确认无误后点击合并并下载，即可得到合并后的文件。"
      q1: "文件会被上传吗？"
      a1: "不会。合并完全在你的浏览器中完成，不经过任何服务器，适合处理合同、证件这类敏感文档。"
      q2: "加密的 PDF 能合并吗？"
      a2: "不能。设置了密码的文件无法读取页面，添加后会被标记为已加密，需要先用其他软件解除加密再合并。"
      q3: "合并后清晰度会下降吗？"
      a3: "不会。页面上的文字和图片按原样复制，不会重新压缩，清晰度与原文件一致。"
      q4: "书签和表单会保留吗？"
      a4: "书签不会保留，可填写的表单字段可能失去交互能力。页面上显示的文字、图片和版式会完整保留。"
