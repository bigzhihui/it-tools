    guide:
      intro: "从 PDF 中取出需要的页面另存为新文件，或删掉不需要的页面，例如单独取出合同的签字页，或去掉扫描件中的空白页。处理完全在浏览器本地进行，文件不会上传到任何服务器。"
      usage: "选择一个 PDF 文件，选择保留这些页或删除这些页，再输入页码，例如 1-3, 5, 8-，然后点击下载。多个页码用逗号分隔，1-3 表示第 1 到第 3 页，8- 表示第 8 页到最后一页。"
      q1: "删除的页面会残留在新文件里吗？"
      a1: "不会。新文件只包含保留下来的页面，被删除页面上的文字和图片不会被带进去，指向这些页面的链接也会一并移除。"
      q2: "可以调整页面顺序吗？"
      a2: "可以。选择保留这些页时，页面按你输入的顺序排列，例如输入 3, 1, 2 会依次得到第 3、1、2 页。重复的页码只保留一次。"
      q3: "可以用中文逗号输入页码吗？"
      a3: "可以。中文逗号、顿号、全角数字和全角横线都能识别，例如 1－3，5。"
      q4: "加密的 PDF 能处理吗？"
      a4: "不能。设置了密码的文件无法读取页面，需要先用其他软件解除加密。"
      q5: "书签和表单会保留吗？"
      a5: "书签不会保留。表单字段会保留当前显示的内容，但不能再填写。页面上的文字、图片和版式会完整保留。"
