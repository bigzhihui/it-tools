    unescapeCardTitle: 反转义 HTML 实体 (Unescape)
    yourEscapedString: 待反转义的字符串：
    stringToUnescapePlaceholder: 在此输入需要反转义的字符串...
    yourStringUnescaped: 反转义后字符串：
    stringUnescapedPlaceholder: 反转义后的字符串将显示在此处
    copied: 已复制到剪贴板！
    guide:
      intro: "在网页里显示小于号、大于号、和号或引号时，需要先把它们转义成 HTML 实体，否则可能被浏览器当成标签解析，甚至引发跨站脚本漏洞。本工具可以双向转义与还原。"
      usage: "在转义区输入原始文本，即可得到实体编码后的结果。在还原区粘贴包含 &lt; 这类实体的文本，即可还原为原始字符。"
      q1: "哪些字符会被转义？"
      a1: "小于号、大于号、和号、双引号和单引号这五个字符，它们在 HTML 中具有特殊含义。"
      q2: "转义能防止 XSS 攻击吗？"
      a2: "把用户输入插入 HTML 正文时，转义这五个字符是防御跨站脚本的基础手段。但插入到 JavaScript 代码、网址或样式中时，需要使用对应场景的转义方式，只做 HTML 转义并不够。"
      q3: "中文需要转义吗？"
      a3: "不需要。只要页面声明了 UTF-8 编码，中文就可以直接显示，转义只针对具有特殊含义的符号。"
  json-prettify:
    title: JSON 美化与格式化
    description: 将 JSON 字符串格式化为结构清晰、易于阅读的优美格式。
