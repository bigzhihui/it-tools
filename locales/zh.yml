    guide:
      intro: "Base64 是一种把任意数据表示成可打印字符的编码方式，常见于邮件附件、数据 URL 和接口传输。本工具支持编码和解码两个方向，全部在浏览器本地完成。"
      usage: "在编码区输入文本即可得到 Base64 结果，在解码区粘贴 Base64 字符串即可还原原文。结果要放进网址或文件名时，可以开启 URL 安全模式，它会用短横线和下划线替换加号和斜杠，并去掉末尾的等号。"
      q1: "中文编码后会乱码吗？"
      a1: "不会。本工具按 UTF-8 处理文本，中文和表情符号都能正确编码与还原，结果与主流编程语言的默认行为一致。"
      q2: "Base64 能用来加密吗？"
      a2: "不能。Base64 只是编码，任何人都可以直接解码还原，不提供任何保密性。需要保护数据时，请使用加密工具。"
      q3: "为什么编码后内容变长了？"
      a3: "Base64 用 4 个字符表示 3 个字节，编码后的长度约为原始数据的三分之四，末尾还可能补上等号凑齐长度。"
